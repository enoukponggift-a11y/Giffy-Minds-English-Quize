<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giffy Minds Academy — Primary 1 English Grammar Mastery</title>
<style>
  :root {
    --navy: #1D2A57;
    --gold: #F5A623;
    --leaf: #4CAF7D;
    --coral: #E85D5D;
    --cream: #FFF8EC;
    --ink: #26314F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, #2E3E73 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .app { width: 100%; max-width: 480px; }
  .brand { text-align: center; color: var(--cream); margin-bottom: 18px; }
  .brand .logo { font-size: 26px; font-weight: 800; letter-spacing: 0.3px; }
  .brand .tagline { font-size: 12px; opacity: 0.75; margin-top: 2px; }
  .card {
    background: var(--cream);
    border-radius: 20px;
    padding: 24px 22px 26px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }
  .book-title { font-size: 13px; color: var(--navy); font-weight: 700; opacity: 0.7; }
  .topic-title { font-size: 19px; color: var(--navy); font-weight: 800; margin: 2px 0 16px; }
  .progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .progress-track { flex: 1; height: 10px; background: #E6E0D2; border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 6px; transition: width 0.35s ease; }
  .progress-label { font-size: 12px; font-weight: 700; color: var(--navy); white-space: nowrap; }
  .question { font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.4; margin-bottom: 16px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    text-align: left; padding: 14px 16px; border-radius: 12px;
    border: 2px solid #DDD6C4; background: #fff; font-size: 16px;
    color: var(--ink); cursor: pointer; transition: all 0.15s ease;
  }
  .option:active { transform: scale(0.98); }
  .option.correct { border-color: var(--leaf); background: #E9F8EF; color: #1F6B45; font-weight: 700; }
  .option.wrong { border-color: var(--coral); background: #FDEBEB; color: #B23A3A; font-weight: 700; }
  .option.disabled { pointer-events: none; opacity: 0.55; }
  .option.disabled.correct, .option.disabled.wrong { opacity: 1; }
  .feedback { margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-size: 15px; display: none; animation: pop 0.25s ease; }
  @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .feedback.show { display: block; }
  .feedback.right { background: #E9F8EF; border: 2px solid var(--leaf); }
  .feedback.wrong { background: #FDEBEB; border: 2px solid var(--coral); }
  .feedback .verdict { font-weight: 800; font-size: 16px; margin-bottom: 4px; }
  .feedback.right .verdict { color: #1F6B45; }
  .feedback.wrong .verdict { color: #B23A3A; }
  .feedback .explain { color: var(--ink); line-height: 1.4; }
  .next-btn {
    margin-top: 18px; width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: var(--navy); color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; display: none;
  }
  .next-btn.show { display: block; }
  .next-btn:active { transform: scale(0.98); }
  .screen { display: none; text-align: center; }
  .screen.show { display: block; }
  .screen .emoji { font-size: 48px; margin-bottom: 8px; }
  .screen .score { font-size: 32px; font-weight: 800; color: var(--navy); }
  .screen .msg { font-size: 15px; color: var(--ink); margin: 8px 0 20px; }
  .action-btn {
    padding: 14px 20px; border: none; border-radius: 12px;
    background: var(--gold); color: var(--navy); font-weight: 800;
    font-size: 15px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="app">
  <div class="brand">
    <div class="logo">GIFFY MINDS ACADEMY</div>
    <div class="tagline">Raising Global Leaders</div>
  </div>

  <div class="card">
    <div id="quizView">
      <div class="book-title">Primary 1 English Grammar Mastery — Book 1</div>
      <div class="topic-title" id="topicTitle"></div>

      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div class="progress-label" id="progressLabel"></div>
      </div>

      <div class="question" id="questionText"></div>
      <div class="options" id="optionsList"></div>

      <div class="feedback" id="feedback">
        <div class="verdict" id="verdict"></div>
        <div class="explain" id="explain"></div>
      </div>

      <button class="next-btn" id="nextBtn">Next Question</button>
    </div>

    <div class="screen" id="topicCompleteView">
      <div class="emoji">🎉</div>
      <div class="score" id="topicScore">0 / 20</div>
      <div class="msg" id="topicMsg">Topic complete!</div>
      <button class="action-btn" id="continueBtn">Continue to Next Topic</button>
    </div>

    <div class="screen" id="finalView">
      <div class="emoji">🏆</div>
      <div class="score" id="finalScore">0 / 40</div>
      <div class="msg">Book 1 complete! Great work.</div>
      <button class="action-btn" id="restartBtn">Start Over</button>
    </div>
  </div>
</div>

  const topicScoreEl = document.getElementById('topicScore');
  const topicMsg = document.getElementById('topicMsg');
  const finalScoreEl = document.getElementById('finalScore');

  function loadQuestion() {
    answered = false;
    feedback.classList.remove('show', 'right', 'wrong');
    nextBtn.classList.remove('show');

    const topic = topics[topicIndex];
    const q = topic.questions[current];
    topicTitle.textContent = topic.title;
    questionText.textContent = q.text;
    progressLabel.textContent = `Q${current + 1} of ${topic.questions.length}`;
    progressFill.style.width = `${(current / topic.questions.length) * 100}%`;

    optionsList.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt;
      btn.addEventListener('click', () => selectAnswer(i, btn));
      optionsList.appendChild(btn);
    });
  }

  function selectAnswer(index, btn) {
    if (answered) return;
    answered = true;

    const q = topics[topicIndex].questions[current];
    const allBtns = optionsList.querySelectorAll('.option');
    allBtns.forEach(b => b.classList.add('disabled'));

    if (index === q.correctIndex) {
      btn.classList.add('correct');
      verdict.textContent = "Correct! ✅";
      feedback.classList.add('show', 'right');
      topicScore++;
      totalScore++;
    } else {
      btn.classList.add('wrong');
      allBtns[q.correctIndex].classList.add('correct');
      verdict.textContent = "Try again! ❌";
      feedback.classList.add('show', 'wrong');
    }

    explain.textContent = q.explain;
    nextBtn.classList.add('show');
  }

  nextBtn.addEventListener('click', () => {
    current++;
    const topic = topics[topicIndex];
    if (current < topic.questions.length) {
      loadQuestion();
    } else if (topicIndex < topics.length - 1) {
      showTopicComplete();
    } else {
      showFinal();
    }
  });

  function showTopicComplete() {
    quizView.style.display = 'none';
    topicCompleteView.classList.add('show');
    topicScoreEl.textContent = `${topicScore} / ${topics[topicIndex].questions.length}`;
    topicMsg.textContent = `You finished "${topics[topicIndex].title}"!`;
  }

  document.getElementById('continueBtn').addEventListener('click', () => {
    topicIndex++;
    current = 0;
    topicScore = 0;
    topicCompleteView.classList.remove('show');
    quizView.style.display = 'block';
    loadQuestion();
  });

  function showFinal() {
    quizView.style.display = 'none';
    topicCompleteView.classList.remove('show');
    finalView.classList.add('show');
    const totalQuestions = topics.reduce((sum, t) => sum + t.questions.length, 0);
    finalScoreEl.textContent = `${totalScore} / ${totalQuestions}`;
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    topicIndex = 0;
    current = 0;
    topicScore = 0;
    totalScore = 0;
    finalView.classList.remove('show');
    quizView.style.display = 'block';
    loadQuestion();
  });

  // start
  loadQuestion();
</script>

</body>
</html>
